<script>

   MATERI   : jangan diubah ("balik").                          */
window.PTLDV_CONFIG={ENDPOINT:"https://script.google.com/macros/s/AKfycby1zd8KbVSOtalmUUPN-4WRoejalQk1LVNY7yZlQrCo9IWfFRpzfdsJhB4_-aOgtiSl/exec",MATERI:"balik"};

<script>
(function(){
'use strict';
var CONFIG=window.PTLDV_CONFIG||{ENDPOINT:'https://script.google.com/macros/s/AKfycby1zd8KbVSOtalmUUPN-4WRoejalQk1LVNY7yZlQrCo9IWfFRpzfdsJhB4_-aOgtiSl/exec',MATERI:'balik'};
/* ============================================================
   CORE BERSAMA (dipakai persis sama oleh halaman siswa dan server)
   Jangan diubah sebagian: pembangkit soal dan penilai harus
   identik di kedua sisi. Server menolak halaman yang "cek"-nya
   berbeda.
   ============================================================ */
var CORE=(function(){
'use strict';
var VERSI='2026-10-28.2';
var R=10;
var OPS=['<','≤','>','≥'];
var isSolid=function(op){return op==='≤'||op==='≥';};
var holds=function(v,c,op){return op==='<'?v<c:op==='≤'?v<=c:op==='>'?v>c:v>=c;};
var sideOf=function(op){return (op==='<'||op==='≤')?-1:1;};
var gcd=function(a,b){return b?gcd(b,a%b):a;};
var hyp=function(a,b){return Math.sqrt(a*a+b*b);};   /* sqrt: dibulatkan benar oleh IEEE, sama di semua mesin */
var isNum=function(v){return typeof v==='number'&&isFinite(v);};
var isInt=function(v){return isNum(v)&&Math.floor(v)===v;};
var inGrid=function(p){return !!p&&isInt(p.x)&&isInt(p.y)&&Math.abs(p.x)<=R&&Math.abs(p.y)<=R;};
var NAMES={pts:'Dua titik',eq:'Persamaan garis',types:'Jenis garis',pick:'Titik uji',subst:'Substitusi',ops:'Menulis pertidaksamaan'};

/* ---------- bilangan acak berbenih ---------- */
function mulberry32(seed){
  var a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)>>>0;
    var t=a;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return((t^(t>>>14))>>>0)/4294967296;
  };
}
function rndInt(rng,a,b){return Math.floor(rng()*(b-a+1))+a;}
function shuffle(arr,rng){
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}

/* ---------- soal ---------- */
var FIXED={
 1:[[{a:2,b:3,op:'≤',c:12}],[{a:1,b:-1,op:'>',c:2}]],
 2:[[{a:1,b:1,op:'≤',c:6},{a:0,b:1,op:'≥',c:1}],[{a:2,b:1,op:'≥',c:4},{a:1,b:2,op:'≤',c:8}]],
 3:[[{a:1,b:1,op:'≤',c:6},{a:1,b:0,op:'≥',c:0},{a:0,b:1,op:'≥',c:0}],[{a:1,b:1,op:'>',c:2},{a:1,b:-1,op:'<',c:4},{a:0,b:1,op:'<',c:5}]]
};
function prepI(r){
  var q={a:r.a,b:r.b,c:r.c,op:r.op,lat:[]};
  q.solid=isSolid(q.op);
  for(var x=-9;x<=9;x++)for(var y=-9;y<=9;y++)if(q.a*x+q.b*y===q.c)q.lat.push({x:x,y:y});
  var ax=q.lat.filter(function(p){return p.x===0||p.y===0;});
  q.hintPt=(ax.length?ax:q.lat)[0];
  return q;
}

/* ---------- geometri ---------- */
var WIN=[[-R,-R],[R,-R],[R,R],[-R,R]];
function clipHalf(poly,q,side){
  var f=function(p){return side*(q.a*p[0]+q.b*p[1]-q.c);},out=[];
  for(var i=0;i<poly.length;i++){
    var P=poly[i],Q=poly[(i+1)%poly.length],fp=f(P),fq=f(Q);
    if(fp>=0)out.push(P);
    if((fp>0&&fq<0)||(fp<0&&fq>0)){var t=fp/(fp-fq);out.push([P[0]+t*(Q[0]-P[0]),P[1]+t*(Q[1]-P[1])]);}
  }
  return out;
}
function interPoly(s,skip){var poly=WIN;s.forEach(function(q,i){if(i!==skip&&poly.length)poly=clipHalf(poly,q,sideOf(q.op));});return poly;}
function area(poly){var a=0;for(var i=0;i<poly.length;i++){var P=poly[i],Q=poly[(i+1)%poly.length];a+=P[0]*Q[1]-Q[0]*P[1];}return Math.abs(a)/2;}
function lineEnds(q){
  var pts=[],u=[];
  if(q.b!==0)[-R,R].forEach(function(x){var y=(q.c-q.a*x)/q.b;if(y>=-R-1e-9&&y<=R+1e-9)pts.push([x,y]);});
  if(q.a!==0)[-R,R].forEach(function(y){var x=(q.c-q.b*y)/q.a;if(x>=-R-1e-9&&x<=R+1e-9)pts.push([x,y]);});
  pts.forEach(function(p){if(!u.some(function(r){return Math.abs(r[0]-p[0])<1e-6&&Math.abs(r[1]-p[1])<1e-6;}))u.push(p);});
  return u.length>=2?[u[0],u[1]]:null;
}
function holdsAll(s,x,y){return s.every(function(q){return holds(q.a*x+q.b*y,q.c,q.op);});}
function onAnyLine(s,x,y){return s.some(function(q){return q.a*x+q.b*y===q.c;});}
function findInside(s){
  var best=null;
  for(var x=-9;x<=9;x++)for(var y=-9;y<=9;y++){
    var d=1e9;
    s.forEach(function(q){var v=sideOf(q.op)*(q.a*x+q.b*y-q.c)/hyp(q.a,q.b);if(v<d)d=v;});
    if(d>0&&(!best||d>best.d))best={x:x,y:y,d:d};
  }
  return best;
}

/* ---------- pembangkit soal (berbenih) ---------- */
function randLine(rng,op,pos){
  var r=rng();
  if(!pos&&r<.18){
    var k=rndInt(rng,-6,6),o=op||OPS[rndInt(rng,0,3)];
    return rng()<.5?{a:1,b:0,op:o,c:k}:{a:0,b:1,op:o,c:k};
  }
  if(!pos&&r<.28){
    var m=rndInt(rng,1,3),q2=rndInt(rng,1,3),g2=gcd(m,q2),sg=rng()<.5?1:-1;
    return {a:m/g2,b:-q2/g2*sg,c:0,op:op||OPS[rndInt(rng,0,3)]};
  }
  for(;;){
    var p=rndInt(rng,2,8)*(!pos&&rng()<.3?-1:1),q=rndInt(rng,2,8)*(!pos&&rng()<.3?-1:1);
    var a=q,b=p,c=p*q,g=gcd(Math.abs(a),Math.abs(b));
    a/=g;b/=g;c/=g;
    if(a<0){a=-a;b=-b;c=-c;}
    if(Math.abs(a)>9||Math.abs(b)>9||Math.abs(c)>60)continue;
    return {a:a,b:b,c:c,op:op||OPS[rndInt(rng,0,3)]};
  }
}
function validSys(arr){
  var s=arr.map(prepI),i,j;
  for(i=0;i<s.length;i++)if(s[i].lat.length<2)return false;
  for(i=0;i<s.length;i++)for(j=i+1;j<s.length;j++)if(s[i].a*s[j].b-s[j].a*s[i].b===0)return false;
  var A=area(interPoly(s,-1));
  if(s.length===1){if(A<80||A>320)return false;}
  else{
    if(A<12||A>230)return false;
    for(i=0;i<s.length;i++)if(area(interPoly(s,i))-A<1.5)return false;
  }
  var ins=findInside(s);
  return !!ins&&ins.d>=0.9;
}
function genSystem(k,rng){
  for(var t=0;t<2000;t++){
    var arr=[],i;
    if(k===3&&rng()<.4)arr.push(randLine(rng,rng()<.75?'≤':'≥',true),{a:1,b:0,op:'≥',c:0},{a:0,b:1,op:'≥',c:0});
    else for(i=0;i<k;i++)arr.push(randLine(rng));
    shuffle(arr,rng);
    if(validSys(arr))return arr;
  }
  return FIXED[k][0];
}
/* Satu "paket kuis" ditentukan sepenuhnya oleh benih (seed): enam soal berurutan, masing-masing dua soal
   dengan 1, 2, dan 3 pertidaksamaan. Dua soal dengan jumlah pertidaksamaan sama harus berbeda. */
function sameSys(a,b){
  var key=function(q){return q.a+','+q.b+','+q.c+','+q.op;};
  return a.map(key).sort().join('|')===b.map(key).sort().join('|');
}
function buildPack(seed){
  var rng=mulberry32(seed),set=[],ks=[1,1,2,2,3,3];
  ks.forEach(function(k,i){
    var s=null;
    for(var t=0;t<50;t++){
      var c=genSystem(k,rng);
      if(i%2===0||!sameSys(c,set[i-1])){s=c;break;}
    }
    set.push(s||FIXED[k][i%2]);
  });
  return {seed:seed,set:set};
}

/* ---------- pemeriksa langkah (dipakai halaman dan penilai server) ---------- */
function judgePts(q,A,B){
  var bad=[];
  if(q.a*A.x+q.b*A.y!==q.c)bad.push('A');
  if(q.a*B.x+q.b*B.y!==q.c)bad.push('B');
  if(bad.length)return {ok:false,bad:bad,same:false};
  if(A.x===B.x&&A.y===B.y)return {ok:false,bad:[],same:true};
  return {ok:true,bad:[],same:false};
}
function judgeEq(q,a,b,c){
  var prop=(a!==0||b!==0)&&(q.a*b-a*q.b===0)&&(q.a*c-a*q.c===0)&&(q.b*c-b*q.c===0);
  return {ok:!!prop};
}
function judgeTypes(sys,ans,locked){
  var lk=[],firstBad=-1;
  sys.forEach(function(q,k){
    var ok=!!(locked&&locked[k])||((ans[k]==='solid')===q.solid);
    lk.push(ok);
    if(!ok&&firstBad<0)firstBad=k;
  });
  return {locked:lk,allOk:firstBad<0,firstBad:firstBad};
}
function judgePick(sys,x,y){
  if(onAnyLine(sys,x,y))return {ok:false,onLine:true,inside:false};
  if(!holdsAll(sys,x,y))return {ok:false,onLine:false,inside:false};
  return {ok:true,onLine:false,inside:true};
}
function judgeSubst(E,T,ans,lv,lr){
  var vo=[],ro=[],firstBad=-1;
  E.forEach(function(e,k){
    var v=e.a*T.x+e.b*T.y,x=ans[k]||{};
    var a1=!!(lv&&lv[k])||(isNum(x.v)&&Math.abs(x.v-v)<1e-9);
    var a2=!!(lr&&lr[k])||(x.r===(v<e.c?'<':v>e.c?'>':'='));
    vo.push(a1);ro.push(a2);
    if((!a1||!a2)&&firstBad<0)firstBad=k;
  });
  return {valOK:vo,relOK:ro,allOk:firstBad<0,firstBad:firstBad};
}
function expRel(e,T){return (e.a*T.x+e.b*T.y<e.c)?'<':'>';}
function expOp(e,T,solid){
  var rel=expRel(e,T);
  return rel==='<'?(solid?'≤':'<'):(solid?'≥':'>');
}
function judgeOps(sys,E,T,ans,locked){
  var lk=[],firstBad=-1;
  sys.forEach(function(q,k){
    var ok=!!(locked&&locked[k])||ans[k]===expOp(E[k],T,q.solid);
    lk.push(ok);
    if(!ok&&firstBad<0)firstBad=k;
  });
  return {locked:lk,allOk:firstBad<0,firstBad:firstBad};
}

/* ---------- penilai jejak jawaban ---------- */
/* Skor = banyak langkah yang jawabannya benar pada percobaan pertama.
   jejak = daftar peristiwa {p,i,s,a,t}: p=nomor soal, i=nomor garis (-1 bila langkah untuk semua garis),
   s=jenis langkah (pts, eq, types, pick, subst, ops), a=jawaban mentah, t=waktu (ms sejak mulai).
   Hanya jawaban mentah yang dipercaya; benar-salahnya dihitung ulang di sini. */
function gradeTrace(pack,trace){
  var sys=pack.set.map(function(s){return s.map(prepI);});
  var order=[];
  sys.forEach(function(s,p){
    s.forEach(function(q,i){order.push({p:p,i:i,s:'pts'});order.push({p:p,i:i,s:'eq'});});
    ['types','pick','subst','ops'].forEach(function(k){order.push({p:p,i:-1,s:k});});
  });
  var ev=Array.isArray(trace)?trace:[];
  var c=0,wrong=false,score=0,ignored=0,missed={},steps=[],lastT=0,monotonic=true;
  var cp=-1,E=[],T=null,lt=[],lv=[],lr=[],lo=[];
  function enter(p){
    cp=p;E=[];T=null;lt=[];lv=[];lr=[];lo=[];
    sys[p].forEach(function(){lt.push(false);lv.push(false);lr.push(false);lo.push(false);});
  }
  function done(){
    var d=order[c];
    steps.push({p:d.p,i:d.i,s:d.s,ok:!wrong});
    if(wrong){var nm=NAMES[d.s];missed[nm]=(missed[nm]||0)+1;}else score++;
    c++;wrong=false;
  }
  for(var k=0;k<ev.length;k++){
    var e=ev[k];
    if(!e||typeof e!=='object'){ignored++;continue;}
    if(isNum(e.t)){if(e.t<lastT)monotonic=false;else lastT=e.t;}
    var d=order[c];
    if(!d||e.p!==d.p||e.i!==d.i||e.s!==d.s){ignored++;continue;}
    if(d.p!==cp)enter(d.p);
    var S=sys[d.p],q=d.i>=0?S[d.i]:null,a=e.a,m=S.length,r,j,bad=false;
    if(d.s==='pts'){
      if(!a||!inGrid(a.A)||!inGrid(a.B)){ignored++;continue;}
      if(judgePts(q,a.A,a.B).ok)done();else wrong=true;
    }else if(d.s==='eq'){
      if(!Array.isArray(a)||a.length!==3||!isInt(a[0])||!isInt(a[1])||!isInt(a[2])){ignored++;continue;}
      if(judgeEq(q,a[0],a[1],a[2]).ok){E[d.i]={a:a[0],b:a[1],c:a[2]};done();}else wrong=true;
    }else if(d.s==='types'){
      if(!Array.isArray(a)||a.length!==m){ignored++;continue;}
      for(j=0;j<m;j++)if(a[j]!=='solid'&&a[j]!=='dash')bad=true;
      if(bad){ignored++;continue;}
      r=judgeTypes(S,a,lt);lt=r.locked;
      if(r.allOk)done();else wrong=true;
    }else if(d.s==='pick'){
      if(!inGrid(a)){ignored++;continue;}
      r=judgePick(S,a.x,a.y);
      if(r.ok){T={x:a.x,y:a.y};done();}else wrong=true;
    }else if(d.s==='subst'){
      if(!Array.isArray(a)||a.length!==m){ignored++;continue;}
      for(j=0;j<m;j++){var x=a[j];if(!x||typeof x!=='object'||!(x.v===null||isNum(x.v))||!(x.r===null||typeof x.r==='string'))bad=true;}
      if(bad){ignored++;continue;}
      r=judgeSubst(E,T,a,lv,lr);lv=r.valOK;lr=r.relOK;
      if(r.allOk)done();else wrong=true;
    }else{   /* ops */
      if(!Array.isArray(a)||a.length!==m){ignored++;continue;}
      for(j=0;j<m;j++)if(OPS.indexOf(a[j])<0)bad=true;
      if(bad){ignored++;continue;}
      r=judgeOps(S,E,T,a,lo);lo=r.locked;
      if(r.allOk)done();else wrong=true;
    }
  }
  return {score:score,max:order.length,done:c,complete:c===order.length,ignored:ignored,missed:missed,steps:steps,monotonic:monotonic,lastT:lastT};
}

/* ---------- sidik jari kode: halaman dan server harus menghasilkan nilai yang sama ---------- */
function djb2(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(16);}
function cek(){
  var pk=buildPack(20261028),S=pk.set[0],P=S.map(prepI),ins=findInside(S),sm=[],t=0;
  function add(p,i,s,a){sm.push({p:p,i:i,s:s,a:a,t:++t});}
  P.forEach(function(q,i){
    add(0,i,'pts',{A:{x:0,y:0},B:{x:1,y:1}});
    add(0,i,'pts',{A:q.lat[0],B:q.lat[1]});
    add(0,i,'eq',[q.a+1,q.b,q.c]);
    add(0,i,'eq',[2*q.a,2*q.b,2*q.c]);
  });
  add(0,-1,'types',P.map(function(q){return q.solid?'dash':'solid';}));
  add(0,-1,'types',P.map(function(q){return q.solid?'solid':'dash';}));
  add(0,-1,'pick',{x:P[0].lat[0].x,y:P[0].lat[0].y});
  add(0,-1,'pick',{x:ins.x,y:ins.y});
  add(0,-1,'subst',P.map(function(){return {v:0,r:'='};}));
  add(0,-1,'subst',P.map(function(q){var v=2*q.a*ins.x+2*q.b*ins.y;return {v:v,r:v<2*q.c?'<':'>'};}));
  add(0,-1,'ops',P.map(function(){return OPS[0];}));
  add(0,-1,'ops',P.map(function(q){return expOp({a:2*q.a,b:2*q.b,c:2*q.c},ins,q.solid);}));
  add(9,9,'zz',1);
  return VERSI+':'+djb2(JSON.stringify({pk:pk,g:gradeTrace(pk,sm)}));
}

var AUTO_JEDA=[4000,8000];   /* percobaan ulang otomatis: jeda (ms) sebelum percobaan ke-1 dan ke-2 */
var sendSeq=0;
function sendBody(body,n){
  var id=++sendSeq;n=n||0;
  var stale=function(){return id!==sendSeq;};
  var show=function(x){st.send=x;if(st.over)renderPanel();};
  var fail=function(msg,retry){
    if(stale())return;
    if(retry&&n<AUTO_JEDA.length){
      show({state:'sending',n:n+1,wait:true});
      setTimeout(function(){if(!stale())sendBody(body,n+1);},AUTO_JEDA[n]);
      return;
    }
    show({state:'err',msg:msg,retry:retry});
  };
  show({state:'sending',n:n});
  callServer(body).then(function(res){
    if(res&&res.ok){clearPending();if(!stale())show({state:'ok',res:res});}
    else{var f=fatalCode(res);if(f)clearPending();fail((res&&res.pesan)||'Skor belum diterima. Tunjukkan layar ini ke gurumu.',!f);}
  }).catch(function(err){fail(netMsg(err),true);});
}

  if(!st.sys)return;
  var k=st.sys.length;
  $('#probAsk').innerHTML='Daerah penyelesaian (DP) adalah daerah <b class="okc">hijau</b>. Tentukan '+(k===1?'pertidaksamaan':'sistem pertidaksamaan')+' yang menghasilkan DP itu.';
  $('#probText').innerHTML='<div class="brace">{</div><div class="srows">'+st.sys.map(function(q,i){
    var cur=st.stage==='work'&&((st.step===1&&st.i===i)||st.step>1);
    var cls='srow'+(st.stage==='work'&&st.step===1&&st.i===i?' cur':'');
    return '<div class="'+cls+'"><i style="background:'+COL[i]+'"></i><b>'+ordinal(i)+'</b><span>'+rowText(i)+'</span>'+(st.L[i].opOK?'<b class="okc">✓</b>':'')+'</div>';
  }).join('')+'</div>';
  $('#probMeta').textContent=st.mode==='learn'?(st.info?st.info.jd+' · '+st.info.lv:'Soal dengan '+k+' pertidaksamaan (Latihan Mandiri)'):((st.sess&&st.sess.nama?st.sess.nama+' · ':'')+'Soal '+(st.idx+1)+' dari '+st.set.length+' · Skor '+st.score+' / '+st.max);
  $('#bRepeat').hidden=st.mode!=='learn';
  $('#bNextQ').hidden=st.mode!=='learn';
}
function renderProgress(){
  if(st.mode==='learn'&&st.item&&!st.gate)return itemProgres();
  if(!st.sys||st.gate||st.mode==='explain')return;
  var items=[{l:'Soal',d:st.stage!=='intro',c:st.stage==='intro'}];
  for(var s=1;s<=4;s++){
    var done=st.stage==='done'||(st.stage==='work'&&s<st.step);
    items.push({l:STEPN[s-1],d:done,c:st.stage==='work'&&st.step===s});
  }
  $('#progress').innerHTML=items.map(function(it,i){
    return '<li class="'+(it.d?'done':it.c?'cur':'')+'"><span>'+(it.d?'✓':i+1)+'</span><em>'+it.l+'</em></li>';
  }).join('');
  var t='';
  if(st.stage==='intro')t='Pilih soal dan amati gambar';
  else if(st.stage==='work')t='Langkah '+st.step+' dari 4: '+STEPN[st.step-1]+(st.step===1?' · garis '+ordinal(st.i)+' dari '+st.sys.length:'');
  else t='Selesai 🎉';
  $('#stepText').textContent=t;
}
function renderPanel(){
  var el=$('#panel');
  if(st.mode==='explain')return explainPanel(el);
  if(st.mode==='learn'&&st.item&&st.stage!=='intro')return itemPanel(el);
  if(st.gate)return loginPanel(el);
  if(st.over)return overPanel(el);
  if(st.stage==='intro')introPanel(el);
  else if(st.stage==='done')summaryPanel(el);
  else [null,step1,step2,step3,step4][st.step](el);
  pendNotice(el);
}

/* ---------- Soal ---------- */
function introPanel(el){
  if(st.mode==='learn')return latihanIntro(el);
  var learn=st.mode==='learn',h='',k=st.sys.length,pk=st.pick||{};
  if(learn){
    h+='<h2>Pilih soal</h2><p class="muted">Pilih banyak pertidaksamaan yang ingin dilatih.</p>';
    [1,2,3].forEach(function(l){
      h+='<div class="lvl"><b>'+l+' pertidaksamaan</b><div class="chips">'
        +[0,1].map(function(j){return '<button class="chip'+(pk.l===l&&pk.j===j?' on':'')+'" data-l="'+l+'" data-j="'+j+'">Contoh '+'AB'[j]+'</button>';}).join('')
        +'<button class="chip'+(pk.l===l&&pk.j==='r'?' on':'')+'" data-l="'+l+'" data-j="r">🎲 Soal baru</button></div></div>';
    });
  }else h+='<h2>Baca soal</h2>';
  h+='<div class="note"><p>Pada gambar, daerah <b>hijau</b> adalah daerah penyelesaian dengan <b>'+k+' garis batas</b> '+(k>1?'(diberi label (1), (2), …)':'')+'. Tugasmu menyusun '+(k===1?'pertidaksamaan':'sistem pertidaksamaan')+' yang menghasilkannya.</p>'
    +'<p><b>Rencana:</b> (1) tentukan dua titik lalu persamaan tiap garis, (2) tentukan jenis garis, (3) uji satu titik di dalam DP, (4) tulis tiap pertidaksamaan.</p></div>';
  if(learn)h+='<div class="rule"><b>Ingat aturan garis:</b><br>garis <b>penuh</b> → tanda <b>≤</b> atau <b>≥</b><br>garis <b>putus-putus</b> → tanda <b>&lt;</b> atau <b>&gt;</b></div>';
  h+='<div class="row"><button class="btn primary" id="bStart">Mulai soal</button></div>';
  el.innerHTML=h;
  el.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){
    var l=+b.dataset.l,j=b.dataset.j==='r'?'r':+b.dataset.j;
    setProblem(j==='r'?genSystem(l):FIXED[l][j],{l:l,j:j});
  };});
  on('bStart',function(){st.stage='work';setStep(1,0,'pts');});
}

/* ---------- Langkah 1 ---------- */
function head1(){
  var i=st.i,pills=st.sys.map(function(q,k){return '<span class="'+(st.L[k].eqOK?'dn':k===i?'cur':'')+'" style="'+(k===i?'':'')+'">'+ordinal(k)+(st.L[k].eqOK?' ✓':'')+'</span>';}).join('');
  var sub=['Dua titik','Persamaan'],sk=st.ph==='pts'?0:1;
  return '<h2>Langkah 1 · Garis <span style="color:'+COL[i]+'">'+ordinal(i)+'</span></h2>'
    +'<div class="mini">'+pills+'</div>'
    +'<div class="mini">'+sub.map(function(s,j){return '<span class="'+(j<sk?'dn':j===sk?'cur':'')+'">'+(j+1)+'. '+s+'</span>';}).join('')+'</div>';
}
function step1(el){if(st.ph==='pts')phPts(el);else phEq(el);}
function placing(){return !st.gate&&st.stage==='work'&&st.step===1&&st.ph==='pts'&&!!curL()&&!curL().ptsOK;}
function phPts(el){
  el.innerHTML=head1()+'<p>Perhatikan garis <b style="color:'+COL[st.i]+'">'+ordinal(st.i)+'</b> pada gambar. <b>Geser</b> titik <b>A</b> dan <b>B</b> ke dua titik yang terletak <b>tepat pada garis</b> itu, dengan koordinat bilangan bulat. Titik otomatis menempel ke bilangan bulat terdekat. Kamu juga bisa memilih A atau B di bawah ini, lalu mengetuk tempat tujuannya.</p>'
    +'<div class="chips" id="coordChips"></div>'+hintsBlock()
    +'<div id="actions" class="row">'+hintBtn()+'<button class="btn primary" id="bPlace">Periksa titik</button></div>';
  on('bHint',showHint);on('bPlace',checkPts);updateCoordChips();
}
function updateCoordChips(){
  var c=$('#coordChips');if(!c)return;var L=curL();
  c.innerHTML=['A','B'].map(function(k){var d=L.drag[k];return '<button class="chip'+(L.active===k?' on':'')+'" data-k="'+k+'">'+k+' ('+n(d.x)+', '+n(d.y)+')</button>';}).join('');
  c.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){L.active=b.dataset.k;updateCoordChips();drawPlane();};});
}
function checkPts(){
  var p=curP(),L=curL(),A=L.drag.A,B=L.drag.B;
  rec('pts',{A:{x:A.x,y:A.y},B:{x:B.x,y:B.y}});
  var jr=CORE.judgePts(p,A,B);
  if(!jr.ok){
    st.lw={k:'pts',same:jr.same,bad:jr.bad,A:{x:A.x,y:A.y},B:{x:B.x,y:B.y}};
    if(jr.same){fb('bad','Titik A dan B harus berbeda tempat.');wrongAttempt();return;}
    fb('bad',st.mode==='learn'?'Titik '+jr.bad.join(' dan ')+' belum terletak tepat pada garis '+ordinal(st.i)+'. Periksa lagi posisinya pada gambar.':'Belum tepat, coba lagi.');
    wrongAttempt();return;
  }
  L.ptsOK=true;L.P=[{x:A.x,y:A.y},{x:B.x,y:B.y}];award();
  var hh=$('#hints');if(hh)hh.hidden=true;
  document.querySelectorAll('#coordChips button').forEach(function(b){b.disabled=true;});
  fb('ok','Tepat! Titik A('+n(A.x)+', '+n(A.y)+') dan B('+n(B.x)+', '+n(B.y)+') berada pada garis '+ordinal(st.i)+'.');
  nextBtn('Lanjut',function(){setStep(1,st.i,'eq');});
  drawPlane();
}
function phEq(el){
  var L=curL(),P=L.P;
  el.innerHTML=head1()+'<p>Titik pada garis '+ordinal(st.i)+': <b>A('+n(P[0].x)+', '+n(P[0].y)+')</b> dan <b>B('+n(P[1].x)+', '+n(P[1].y)+')</b>. Tentukan persamaan garisnya dalam bentuk <b>ax + by = c</b>.</p>'
    +'<div class="eqin"><input class="num" id="ea" type="number" step="any" inputmode="decimal" aria-label="nilai a"><span>x +</span><input class="num" id="eb" type="number" step="any" inputmode="decimal" aria-label="nilai b"><span>y =</span><input class="num" id="ec" type="number" step="any" inputmode="decimal" aria-label="nilai c"></div>'
    +'<p class="muted">Gunakan bilangan bulat; tulis 0 bila suatu suku tidak ada. Bentuk paling sederhana lebih baik, tetapi kelipatannya juga diterima.</p>'
    +hintsBlock()+'<div id="actions" class="row">'+hintBtn()+'<button class="btn primary" id="bCheck">Periksa</button></div>';
  on('bHint',showHint);on('bCheck',checkEq);
  ['ea','eb','ec'].forEach(function(id){$('#'+id).addEventListener('keydown',function(e){if(e.key==='Enter')checkEq();});});
}
function checkEq(){
  var p=curP(),L=curL(),a=$('#ea').value,b=$('#eb').value,c=$('#ec').value;
  if(a===''||b===''||c===''){fb('info','Isi ketiga kotak (a, b, dan c) terlebih dahulu.');return;}
  a=parseFloat(a);b=parseFloat(b);c=parseFloat(c);
  if(!Number.isInteger(a)||!Number.isInteger(b)||!Number.isInteger(c)){fb('info','Gunakan bilangan bulat untuk a, b, dan c.');return;}
  rec('eq',[a,b,c]);
  var prop=CORE.judgeEq(p,a,b,c).ok;
  if(!prop){
    st.lw={k:'eq',a:a,b:b,c:c,P:L.P.map(function(q){return {x:q.x,y:q.y};})};
    var onP=L.P.every(function(q){return a*q.x+b*q.y===c;});
    fb('bad',st.mode==='learn'?(onP?'Persamaanmu melalui titik A dan B, tetapi bukan garis yang dimaksud. Periksa kembali.':'Belum tepat: persamaan itu tidak melalui kedua titik. Substitusikan titik A dan B untuk memeriksanya.'):'Belum tepat, coba lagi.');
    wrongAttempt();return;
  }
  L.E={a:a,b:b,c:c,op:'='};L.eqOK=true;award();
  var hh=$('#hints');if(hh)hh.hidden=true;
  document.querySelectorAll('#ea,#eb,#ec').forEach(function(i){i.disabled=true;i.classList.add('ok');});
  var same=(a===p.a&&b===p.b&&c===p.c);
  fb('ok','Tepat! Persamaan garis '+ordinal(st.i)+': <span class="eq">'+esc(fmtEq(L.E))+'</span>.'+(same?'':' Bentuk paling sederhananya: <span class="eq">'+esc(fmtEq(p))+'</span>.'));
  if(st.mode==='learn')tampilPny([pnyDuaTitik(L.P[0],L.P[1],'Persamaan garis '+ordinal(st.i)+' melalui A('+n(L.P[0].x)+', '+n(L.P[0].y)+') dan B('+n(L.P[1].x)+', '+n(L.P[1].y)+')')]);
  var last=st.i>=st.sys.length-1;
  nextBtn(last?'Langkah 2':'Garis '+ordinal(st.i+1)+'',function(){if(last)setStep(2);else setStep(1,st.i+1,'pts');});
}

/* ---------- Langkah 2 ---------- */
var SVG_SOLID='<svg width="46" height="10" aria-hidden="true"><line x1="2" y1="5" x2="44" y2="5" stroke="currentColor" stroke-width="3.5"/></svg>';
var SVG_DASH='<svg width="46" height="10" aria-hidden="true"><line x1="2" y1="5" x2="44" y2="5" stroke="currentColor" stroke-width="3.5" stroke-dasharray="8 6"/></svg>';
function step2(el){
  var rows=st.sys.map(function(p,k){
    var L=st.L[k];
    return '<div class="trow'+(L.typeOK?' ok':'')+'" data-k="'+k+'"><div><b style="color:'+COL[k]+'">'+ordinal(k)+'</b> <span class="eq">'+esc(fmtEq(L.E))+'</span></div>'
      +'<div class="seg"><button class="segb'+(L.type==='solid'?' on':'')+'" data-k="'+k+'" data-t="solid"'+(L.typeOK?' disabled':'')+'>'+SVG_SOLID+' Penuh</button>'
      +'<button class="segb'+(L.type==='dash'?' on':'')+'" data-k="'+k+'" data-t="dash"'+(L.typeOK?' disabled':'')+'>'+SVG_DASH+' Putus-putus</button></div></div>';
  }).join('');
  el.innerHTML='<h2>Langkah 2 · Jenis garis</h2><p>Perhatikan gambar: setiap garis batas digambar <b>penuh</b> atau <b>putus-putus</b>. Pilih jenis garis yang kamu lihat untuk tiap persamaan.</p>'
    +rows+hintsBlock()+'<div id="actions" class="row">'+hintBtn()+'<button class="btn primary" id="bCheck">Periksa</button></div>';
  on('bHint',showHint);on('bCheck',checkTypes);
  el.querySelectorAll('.segb').forEach(function(b){b.onclick=function(){
    var k=+b.dataset.k,L=st.L[k];if(L.typeOK)return;
    L.type=b.dataset.t;
    var row=el.querySelector('.trow[data-k="'+k+'"]');row.classList.remove('bad');
    row.querySelectorAll('.segb').forEach(function(x){x.classList.toggle('on',x.dataset.t===L.type);});
  };});
}
function checkTypes(){
  var allSet=st.L.every(function(L){return !!L.type;});
  if(!allSet){fb('info','Pilih jenis garis untuk semua persamaan terlebih dahulu.');return;}
  var ans=st.L.map(function(L){return L.type;});
  rec('types',ans);
  var jr=CORE.judgeTypes(st.sys,ans,st.L.map(function(L){return L.typeOK;}));
  var firstBad=jr.firstBad;
  st.sys.forEach(function(p,k){
    var L=st.L[k],ok=jr.locked[k],row=document.querySelector('.trow[data-k="'+k+'"]');
    if(ok){L.typeOK=true;row.classList.add('ok');row.classList.remove('bad');row.querySelectorAll('.segb').forEach(function(b){b.disabled=true;});}
    else{row.classList.add('bad');}
  });
  if(firstBad<0){
    award();
    var hh=$('#hints');if(hh)hh.hidden=true;
    fb('ok','Tepat! '+st.sys.map(function(p,k){return '<b style="color:'+COL[k]+'">'+ordinal(k)+'</b> '+(p.solid?'penuh → tanda memuat “sama dengan” (≤ atau ≥)':'putus-putus → tanda &lt; atau &gt;');}).join('<br>'));
    nextBtn('Langkah 3',function(){setStep(3,0,'pick');});
  }else{
    st.badIdx=firstBad;st.lw={k:'types',row:firstBad};
    fb('bad',st.mode==='learn'?'Jenis garis '+ordinal(firstBad)+' belum tepat. Lihat kembali gambar dengan teliti.':'Belum tepat, coba lagi.');
    wrongAttempt();
  }
}

/* ---------- Langkah 3 ---------- */
function step3(el){if(st.ph==='pick')phPick(el);else phSubst(el);}
function phPick(el){
  el.innerHTML='<h2>Langkah 3 · Uji satu titik di dalam DP</h2>'
    +'<p>Pilih <b>satu titik</b> yang berada <b>di dalam DP</b> (daerah hijau) dan <b>tidak</b> terletak pada garis. Gunakan koordinat bilangan bulat. Titik ini akan diuji pada setiap persamaan.</p>'
    +'<div class="xy"><span>(</span><input class="num" id="tx" type="number" step="any" inputmode="decimal" aria-label="nilai x titik uji"><span>,</span><input class="num" id="ty" type="number" step="any" inputmode="decimal" aria-label="nilai y titik uji"><span>)</span><button class="btn" id="bUse">Pilih titik</button></div>'
    +'<p class="muted">Kamu juga bisa mengetuk sebuah titik di dalam DP pada bidang koordinat.</p>'
    +hintsBlock()+'<div id="actions" class="row">'+hintBtn()+'</div>';
  on('bHint',showHint);on('bUse',usePick);
  ['tx','ty'].forEach(function(id){$('#'+id).addEventListener('keydown',function(e){if(e.key==='Enter')usePick();});});
}
function usePick(){
  if(st.T)return;
  var x=parseFloat($('#tx').value),y=parseFloat($('#ty').value);
  if(isNaN(x)||isNaN(y)){fb('info','Isi nilai x dan y titik uji terlebih dahulu.');return;}
  if(!Number.isInteger(x)||!Number.isInteger(y)){fb('info','Gunakan koordinat bilangan bulat.');return;}
  if(Math.abs(x)>R||Math.abs(y)>R){fb('info','Pilih titik di dalam bidang koordinat (−10 sampai 10).');return;}
  rec('pick',{x:x,y:y});
  var jp=CORE.judgePick(st.sys,x,y);
  st.lw={k:'pick',x:x,y:y,onLine:jp.onLine};
  if(jp.onLine){fb('bad','Titik ('+n(x)+', '+n(y)+') terletak <b>tepat pada garis</b>, sehingga hasil perbandingannya akan sama dengan. Pilih titik lain.');wrongAttempt();return;}
  if(!jp.ok){fb('bad',st.mode==='learn'?'Titik ('+n(x)+', '+n(y)+') berada <b>di luar</b> daerah hijau. Pilih titik di dalam DP.':'Belum tepat, coba lagi.');wrongAttempt();return;}
  st.T={x:x,y:y};award();
  document.querySelectorAll('#bUse,#tx,#ty').forEach(function(b){b.disabled=true;});
  var hh=$('#hints');if(hh)hh.hidden=true;
  fb('ok','Tepat! Titik T('+n(x)+', '+n(y)+') berada di dalam DP. Titik ini akan diuji pada tiap persamaan.');
  nextBtn('Lanjut',function(){setStep(3,0,'subst');});
  drawPlane();
}
function tapPick(mx,my){
  if(!$('#tx')||st.T)return;
  $('#tx').value=Math.max(-R,Math.min(R,Math.round(mx)));$('#ty').value=Math.max(-R,Math.min(R,Math.round(my)));usePick();
}
function phSubst(el){
  var T=st.T;
  el.innerHTML='<h2>Langkah 3 · Uji titik T('+n(T.x)+', '+n(T.y)+')</h2>'
    +'<p>Substitusikan T ke ruas kiri setiap persamaan, tulis hasilnya, lalu bandingkan dengan konstanta di ruas kanan.</p>'
    +'<div id="substRows"></div>'+hintsBlock()+'<div id="actions" class="row">'+hintBtn()+'<button class="btn primary" id="bCheck">Periksa</button></div>';
  on('bHint',showHint);on('bCheck',checkSubst);renderSubst();
}
function renderSubst(){
  var T=st.T,box=$('#substRows');
  box.innerHTML=st.sys.map(function(p,k){
    var L=st.L[k],E=L.E,v=E.a*T.x+E.b*T.y,both=L.valOK&&L.relOK,markBad=L.checked&&(!L.valOK||!L.relOK);
    return '<div class="trow'+(both?' ok':markBad?' bad':'')+'" data-k="'+k+'">'
      +'<p class="calc"><b style="color:'+COL[k]+'">'+ordinal(k)+'</b> <span class="eq">'+esc(lhs(E))+'</span> → '+esc(lhsSub(E,T.x,T.y))+' = <input class="num vin'+(L.valOK?' ok':'')+'" data-k="'+k+'" type="number" step="any" inputmode="decimal" value="'+(L.valOK?String(v):L.valIn)+'"'+(L.valOK?' disabled':'')+' aria-label="hasil substitusi persamaan '+(k+1)+'"></p>'
      +'<p class="calc">Bandingkan dengan '+n(E.c)+'</p><p class="calc">'+(L.valOK?n(v):'hasil')+' '
      +['<','=','>'].map(function(r){return '<button class="btn relb'+(L.rel===r?' sel':'')+'" data-k="'+k+'" data-r="'+r+'"'+(L.relOK?' disabled':'')+' aria-label="tanda '+esc(r)+'">'+esc(r)+'</button>';}).join(' ')
      +' '+n(E.c)+'</p></div>';
  }).join('');
  box.querySelectorAll('.vin').forEach(function(i){
    i.addEventListener('input',function(){st.L[+i.dataset.k].valIn=i.value;});
    i.addEventListener('keydown',function(e){if(e.key==='Enter')checkSubst();});
  });
  box.querySelectorAll('.relb').forEach(function(b){b.onclick=function(){
    var L=st.L[+b.dataset.k];if(L.relOK)return;L.rel=b.dataset.r;
    box.querySelectorAll('.relb[data-k="'+b.dataset.k+'"]').forEach(function(x){x.classList.toggle('sel',x.dataset.r===L.rel);});
  };});
}
function checkSubst(){
  var T=st.T,missing=false,firstBad=-1;
  st.sys.forEach(function(p,k){
    var L=st.L[k];
    if(!L.valOK&&L.valIn==='')missing=true;
    if(!L.relOK&&!L.rel)missing=true;
  });
  if(missing){fb('info','Isi hasil substitusi dan pilih tanda perbandingan untuk semua persamaan.');return;}
  var ans=st.L.map(function(L){var z=parseFloat(L.valIn);return {v:isFinite(z)?z:null,r:L.rel||null};});
  rec('subst',ans);
  var jr=CORE.judgeSubst(st.L.map(function(L){return L.E;}),T,ans,st.L.map(function(L){return L.valOK;}),st.L.map(function(L){return L.relOK;}));
  st.L.forEach(function(L,k){L.valOK=jr.valOK[k];L.relOK=jr.relOK[k];L.checked=true;});
  firstBad=jr.firstBad;
  renderSubst();
  if(firstBad<0){
    award();
    var hh=$('#hints');if(hh)hh.hidden=true;
    fb('ok','Tepat! Karena T berada di dalam DP, tanda hasil perbandingan ini adalah arah tanda pertidaksamaan.<br>'+st.sys.map(function(p,k){var E=st.L[k].E;return '<b style="color:'+COL[k]+'">'+ordinal(k)+'</b> '+n(E.a*T.x+E.b*T.y)+' '+(E.a*T.x+E.b*T.y<E.c?'&lt;':'&gt;')+' '+n(E.c);}).join('<br>'));
    if(st.mode==='learn')tampilPny(st.sys.map(function(p,k){return pnyBanding(st.L[k].E,T,'Garis '+ordinal(k));}));
    nextBtn('Langkah 4',function(){setStep(4);});
  }else{
    st.badIdx=firstBad;st.lw={k:'subst',row:firstBad,val:!jr.valOK[firstBad]};
    fb('bad',st.mode==='learn'?'Masih ada yang belum tepat pada persamaan '+ordinal(firstBad)+' (kotak yang benar sudah terkunci). Baca petunjuk, lalu perbaiki.':'Masih ada yang belum tepat, coba lagi.');
    wrongAttempt();
  }
}

function checkOps(){
  if(!st.L.every(function(L){return !!L.op;})){fb('info','Pilih tanda untuk semua pertidaksamaan terlebih dahulu.');return;}
  var ans=st.L.map(function(L){return L.op;});
  rec('ops',ans);
  var jr=CORE.judgeOps(st.sys,st.L.map(function(L){return L.E;}),st.T,ans,st.L.map(function(L){return L.opOK;}));
  var firstBad=jr.firstBad;
  st.sys.forEach(function(p,k){
    var L=st.L[k],row=document.querySelector('.trow[data-k="'+k+'"]');
    if(jr.locked[k]){L.opOK=true;row.classList.add('ok');row.classList.remove('bad');row.querySelectorAll('.opb').forEach(function(b){b.disabled=true;});}

function movePoint(k,c){

/* ---------- bilangan pecahan untuk teks dan TeX ---------- */
function toFrac(v){
  if(Math.abs(v-Math.round(v))<1e-9)return {p:Math.round(v),q:1};
  for(var q=2;q<=24;q++){var p=v*q;if(Math.abs(p-Math.round(p))<1e-9)return {p:Math.round(p),q:q};}
  return {p:Math.round(v*100)/100,q:1};
}
var FR={'1/2':'½','1/3':'⅓','2/3':'⅔','1/4':'¼','3/4':'¾','1/5':'⅕','2/5':'⅖','3/5':'⅗','4/5':'⅘','1/6':'⅙','5/6':'⅚'};
function frac(v){
  var f=toFrac(v);if(f.q===1)return n(f.p);
  var neg=f.p<0,a=Math.abs(f.p),w=Math.floor(a/f.q),r=a%f.q,u=FR[r+'/'+f.q];
  return (neg?'−':'')+(u?(w?w:'')+u:(w?w+' ':'')+r+'/'+f.q);
}
function tn(v){var f=toFrac(v);if(f.q===1)return String(f.p).replace('-','-');return (f.p<0?'-':'')+'\\frac{'+Math.abs(f.p)+'}{'+f.q+'}';}
function tk(v){return v<0?'('+tn(v)+')':tn(v);}
function tLin(a,b){var t='';[[a,'x'],[b,'y']].forEach(function(z){var c=z[0];if(!c)return;var m=Math.abs(c),bd=(m===1?'':tn(m))+z[1];t+=t===''?(c<0?'-':'')+bd:(c<0?' - ':' + ')+bd;});return t||'0';}
function tSub(a,b,x,y){var p=[];if(a!==0)p.push((a===1?'':a===-1?'-':tn(a)+' \\cdot ')+tk(x));if(b!==0)p.push((b===1?'':b===-1?'-':tn(b)+' \\cdot ')+tk(y));return p.join(' + ').replace(/\+ -/g,'- ');}
var TOP={'≤':'\\le','≥':'\\ge','<':'<','>':'>','=':'='};
function tTeks(s){return '\\text{'+String(s).replace(/[\\{}]/g,'')+'}';}
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* blok penyelesaian: [{judul, tex:[baris aligned], txt:[baris teks biasa]}] */
function pnyHTML(bl){
  if(!bl||!bl.length)return '';
  return '<div class="penyelesaian"><b>Penyelesaian</b>'+bl.map(function(b){
    return (b.judul?'<p class="pnyj">'+b.judul+'</p>':'')+'<p class="eq" data-tex="'+escAttr('\\begin{aligned}'+b.tex.join(' \\\\ ')+'\\end{aligned}')+'">'+b.txt.map(esc).join('<br>')+'</p>';
  }).join('')+'</div>';
}
function tampilPny(bl,after){
  var f=after||$('#fb');if(!f||!bl||!bl.length)return;
  var old=$('#panel .penyelesaian');if(old&&old.parentNode)old.parentNode.removeChild(old);
  f.insertAdjacentHTML('afterend',pnyHTML(bl));
  var box=$('#panel .penyelesaian');if(box)renderMath(box);
}
/* substitusi titik ke ax + by lalu bandingkan dengan c */
function pnyUji(q,T,judul){
  var v=q.a*T.x+q.b*T.y,ok=holds(v,q.c,q.op);
  return {judul:judul||('Uji titik ('+n(T.x)+', '+n(T.y)+') pada '+lhs(q)+' '+q.op+' '+n(q.c)),
    tex:[tLin(q.a,q.b)+' &= '+tSub(q.a,q.b,T.x,T.y),'&= '+tn(v),'&\\Rightarrow\\ '+tn(v)+' '+TOP[q.op]+' '+tn(q.c)+'\\quad '+tTeks(ok?'(benar)':'(salah)')],
    txt:[lhs(q)+' = '+lhsSub(q,T.x,T.y)+' = '+n(v),n(v)+' '+q.op+' '+n(q.c)+' → '+(ok?'benar':'salah')]};
}
/* persamaan garis melalui dua titik → bentuk ax + by = c */
function pnyDuaTitik(P1,P2,judul){
  var x1=P1.x,y1=P1.y,dx=P2.x-x1,dy=P2.y-y1,tex,txt;
  judul=judul||('Persamaan garis melalui ('+n(x1)+', '+n(y1)+') dan ('+n(P2.x)+', '+n(P2.y)+')');
  if(dx===0)return {judul:judul,tex:['x &= '+tn(x1)+'\\quad '+tTeks('(kedua titik memiliki x yang sama)')],txt:['Kedua titik memiliki x = '+n(x1)+', jadi x = '+n(x1)]};
  if(dy===0)return {judul:judul,tex:['y &= '+tn(y1)+'\\quad '+tTeks('(kedua titik memiliki y yang sama)')],txt:['Kedua titik memiliki y = '+n(y1)+', jadi y = '+n(y1)]};
  var a=dy,b=-dx,c=dy*x1-dx*y1,g=Math.abs(gcdN(gcdN(a,b),c))||1;
  if(a<0||(a===0&&b<0))g=-g;
  var A=a/g,B2=b/g,Cc=c/g;
  tex=['\\frac{y - y_1}{y_2 - y_1} &= \\frac{x - x_1}{x_2 - x_1}',
    '\\frac{y - '+tk(y1)+'}{'+tn(P2.y)+' - '+tk(y1)+'} &= \\frac{x - '+tk(x1)+'}{'+tn(P2.x)+' - '+tk(x1)+'}',
    '\\frac{y - '+tk(y1)+'}{'+tn(dy)+'} &= \\frac{x - '+tk(x1)+'}{'+tn(dx)+'}',
    tn(dx)+'(y - '+tk(y1)+') &= '+tn(dy)+'(x - '+tk(x1)+')',
    tLin(a,b)+' &= '+tn(c)];
  txt=['(y − y₁)/(y₂ − y₁) = (x − x₁)/(x₂ − x₁)','(y − '+par(y1)+')/'+par(dy)+' = (x − '+par(x1)+')/'+par(dx),
    n(dx)+'(y − '+par(y1)+') = '+n(dy)+'(x − '+par(x1)+')',lhs({a:a,b:b})+' = '+n(c)];
  if(g!==1){tex.push(tLin(A,B2)+' &= '+tn(Cc)+'\\quad '+tTeks(g<0&&Math.abs(g)===1?'(kalikan −1)':'(bagi dengan '+n(g)+')'));txt.push(lhs({a:A,b:B2})+' = '+n(Cc));}
  return {judul:judul,tex:tex,txt:txt};
}
/* substitusi titik T ke ruas kiri lalu bandingkan dengan c (tanda <, =, >) */
function pnyBanding(E,T,judul){
  var v=E.a*T.x+E.b*T.y,r=v<E.c?'<':v>E.c?'>':'=';
  return {judul:judul||('Substitusi ('+n(T.x)+', '+n(T.y)+')'),
    tex:[tLin(E.a,E.b)+' &= '+tSub(E.a,E.b,T.x,T.y),'&= '+tn(v),'&\\Rightarrow\\ '+tn(v)+' '+r+' '+tn(E.c)],
    txt:[lhs(E)+' = '+lhsSub(E,T.x,T.y)+' = '+n(v),n(v)+' '+r+' '+n(E.c)]};
}
function gcdN(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}

  var rg=$('#fxRing'),bm=$('#fxBeam');
  rg.setAttribute('x',r.x);rg.setAttribute('y',r.y);rg.setAttribute('width',r.w);rg.setAttribute('height',r.h);rg.setAttribute('rx',r.round?r.w/2:10);

/* ---------- (4) Rumus (KaTeX): render LaTeX (KaTeX) dengan teks lama sebagai cadangan ----------
   Setiap rumus ditulis <… data-tex="LATEX">TEKS LAMA</…>. Bila KaTeX (JS dan CSS) belum/tidak termuat,
   teks lama tetap tampil apa adanya. Perenderan dilakukan ke elemen sementara lalu ditukar, sehingga
   galat apa pun membuat teks lama tetap utuh. */
var TEX_DUA_TITIK='\\dfrac{y - y_1}{y_2 - y_1} = \\dfrac{x - x_1}{x_2 - x_1}';

function texSubst(x1,y1,dx,dy){return '\\dfrac{y - '+texPar(y1)+'}{'+texPar(dy)+'} = \\dfrac{x - '+texPar(x1)+'}{'+texPar(dx)+'}';}

var MATH_CSS_OK=false;
function mathCss(){
  var l=document.getElementById('katexCss'),okc=MATH_CSS_OK;
  if(!l||!l.sheet)return false;

  if(!okc)return false;

}

  if(!root||!mathReady())return 0;
  var list=[].slice.call(root.querySelectorAll?root.querySelectorAll('[data-tex]'):[]);
  if(root.nodeType===1&&root.hasAttribute('data-tex'))list.unshift(root);
  var c=0;
  list.forEach(function(el){
    if(el.querySelector('.katex'))return;
    var tex=el.getAttribute('data-tex'),tmp;
    try{
      tmp=document.createElement('span');

    }catch(e){return;}

  });

}

/* pembentuk satu contoh kontekstual: Situasi → Diketahui/Ditanyakan → langkah → uji titik → Diskusi → Coba Sendiri
   (format sama dengan tab Belajar sptldv-x) */
function contoh(o){
  var parts=[],beats=[],last=o.v0;
  parts.push('<p class="muted">Konteks: '+o.konteks+'</p><div class="exbox"><b>Situasi</b><p>'+o.situasi+'</p></div>');

  parts.push('<div class="dd"><div class="exbox"><b>Diketahui</b>'+ul(o.dik)+'</div><div class="exbox"><b>Ditanyakan</b>'+ul(o.tanya)+'</div></div>');
  beats.push({show:1,say:'Sebelum melihat penyelesaian, tulis sendiri yang diketahui dan ditanyakan.',v:o.v0});
  o.langkah.forEach(function(l){
    parts.push('<div class="exstep">'+(l[0]?'<b class="lkh">'+l[0].replace(/:$/,'')+'</b> ':'')+l[1]+'</div>');
    if(l[3])last=l[3];

  });
  parts.push('<h3>Uji titik dan tafsirannya</h3>'+tblE(o.head,o.rows,'tuji')+'<p class="muted">✓ = pertidaksamaan bernilai benar, ✗ = salah. Ketuk satu baris untuk melihat titiknya di grafik.</p>');
  beats.push({show:parts.length-1,say:'Titik di DP membuat semua pertidaksamaan benar. Ketuk baris tabel untuk melihat titiknya.',v:o.vAkhir||last});
  parts.push('<div class="exbox"><b>Pertanyaan Diskusi</b>'+ol(o.diskusi)+'<details><summary>Lihat petunjuk jawaban</summary>'+ol(o.kunciD)+'</details></div>');
  beats.push({show:parts.length-1,say:'Diskusikan pertanyaan ini bersama teman.',v:o.vAkhir||last});
  parts.push('<div class="exbox fix"><b>Coba Sendiri</b><p>'+o.coba+'</p><details><summary>Buka kunci</summary><p>'+o.kunciC+'</p></details></div>');
  beats.push({show:parts.length-1,say:'Sekarang giliranmu. Coba sendiri, baru buka kuncinya!',v:o.vCoba||o.vAkhir||last});
  return {t:o.t,jd:o.jd,src:o.src,parts:parts,beats:beats};
}
/* layar bertahap biasa: items = [[HTML bagian | null, ucapan Plus, tampilan (opsional), sasaran Plus (opsional)], ...] */
function scr(t,jd,src,items,go){
  var parts=[],beats=[],last=null;
  items.forEach(function(it){
    if(it[0]!==null)parts.push(it[0]);
    if(it[2])last=it[2];
    beats.push({show:parts.length-1,say:it[1],v:last,at:it[3]});
  });
  return {t:t,jd:jd,src:src,parts:parts,beats:beats,go:!!go};
}

/* ---------- Latihan Mandiri (balik-ptldv.html): Tipe 2 · Sistem dari DP ---------- */
var PAGE={
  jd:'Tipe 2 · Sistem dari DP',kkoM:'menyusun, menentukan, menerapkan',
  tipe:[['1','1 garis batas'],['2','2 garis batas'],['3','3 garis batas atau lebih'],['C','Campuran']],
  levelTipe:{'1':'LMH','2':'MH','3':'MH'},
  gen:function(t,l){var r=Math.random;if(l==='L')return GEN.g2L(r);if(t==='3'&&r()<.4)return GEN.g2Hr(r);return GEN.gEval(r,genSystem(+t));},
  muatMots:function(t){setProblem(genSystem(+t),{l:+t,j:'r'});},
  mulaiMots:function(){st.stage='work';setStep(1,0,'pts');},
  ulangMots:function(){setProblem(st.raw,st.pick);},
  notaMots:function(){var k=st.sys.length;return '<p>Pada gambar, daerah <b>hijau</b> adalah daerah penyelesaian dengan <b>'+k+' garis batas</b>'+(k>1?' (diberi label (1), (2), …)':'')+'. Tugasmu menyusun '+(k===1?'pertidaksamaan':'sistem pertidaksamaan')+' yang menghasilkannya.</p>'
    +'<p><b>Rencana:</b> (1) tentukan dua titik lalu persamaan tiap garis, (2) tentukan jenis garis, (3) uji satu titik di dalam DP, (4) tulis tiap pertidaksamaan.</p>';},
  ingatMots:function(){return '<div class="rule"><b>Ingat aturan garis:</b><br>garis <b>penuh</b> → tanda <b>≤</b> atau <b>≥</b><br>garis <b>putus-putus</b> → tanda <b>&lt;</b> atau <b>&gt;</b></div>';},
  kunci:function(){return st.mode==='learn'?kunciBalik():false;}
};
/* dua titik kisi pada garis, sejauh mungkin satu sama lain di sekitar titik petunjuk */
function duaTitik(p){
  var h=p.hintPt,best=null,bd=-1;
  p.lat.forEach(function(q){if(q.x===h.x&&q.y===h.y)return;var d=Math.hypot(q.x-h.x,q.y-h.y);if(d<=8&&d>bd){bd=d;best=q;}});
  return [{x:h.x,y:h.y},best||p.lat[p.lat.length-1]];
}
/* 🔑 Lihat jawaban: isi jawaban benar ke langkah yang sedang dikerjakan, lalu periksa */
function kunciBalik(){
  if(st.stage!=='work')return false;
  var p=curP(),L=curL();
  if(st.step===1&&st.ph==='pts'){var two=duaTitik(p);L.drag.A=two[0];L.drag.B=two[1];updateCoordChips();checkPts();return true;}
  if(st.step===1){$('#ea').value=p.a;$('#eb').value=p.b;$('#ec').value=p.c;checkEq();return true;}
  if(st.step===2){st.L.forEach(function(Lk,k){if(!Lk.typeOK)Lk.type=st.sys[k].solid?'solid':'dash';});checkTypes();return true;}
  if(st.step===3&&st.ph==='pick'){var ins=findInside(st.sys);$('#tx').value=ins.x;$('#ty').value=ins.y;usePick();return true;}
  if(st.step===3){st.L.forEach(function(Lk){var E=Lk.E,v=E.a*st.T.x+E.b*st.T.y;if(!Lk.valOK)Lk.valIn=String(v);if(!Lk.relOK)Lk.rel=v<E.c?'<':v>E.c?'>':'=';});checkSubst();return true;}
  if(st.step===4){st.L.forEach(function(Lk,k){if(!Lk.opOK)Lk.op=expOp(k);});checkOps();return true;}
  return false;
}

/* pesan pengarah (hanya Latihan Mandiri): sejalan dengan petunjuk yang sudah ada, tanpa membocorkan jawaban */
function plusGuide(){
  if(st.stage!=='work')return plusPick(PLUS.salah);
  if(st.step===1)return st.ph==='pts'?'Titik harus tepat di garis ya':'Coba substitusi kedua titiknya, yuk';
  if(st.step===2)return 'Lihat garisnya dulu ya';
  if(st.step===3)return st.ph==='pick'?'Pilih titik di daerah hijau':'Hitung pelan-pelan, ya';
  return 'Gabungkan jenis garis dan hasil uji';
}
function whereShow(){
  var w=st.lw;if(!w||st.mode!=='learn')return;
  var t=null,msg='',r,q;
  if(w.k==='pts'){
    if(w.same){t={pt:[w.A.x,w.A.y]};msg='Titik A dan B berada di tempat yang sama. Pilih dua titik yang berbeda pada garis '+ordinal(st.i)+'.';}
    else{q=w.bad[0]==='A'?w.A:w.B;t={pt:[q.x,q.y]};msg='Titik '+w.bad[0]+' ('+n(q.x)+', '+n(q.y)+') belum tepat berada pada garis '+ordinal(st.i)+'. Geser ke titik kisi yang tepat di garis.';}
  }else if(w.k==='eq'){
    var bad=null;
    w.P.some(function(P,ix){var v=w.a*P.x+w.b*P.y;if(v!==w.c){bad={P:P,v:v,key:ix?'B':'A'};return true;}return false;});
    if(bad){t={pt:[bad.P.x,bad.P.y]};msg='Substitusikan titik '+bad.key+' ('+n(bad.P.x)+', '+n(bad.P.y)+') ke persamaanmu: hasilnya '+n(bad.v)+', bukan '+n(w.c)+'. Persamaan harus dipenuhi kedua titik.';}
    else{t={el:'#ec'};msg='Persamaanmu melalui kedua titik, tetapi belum menggambarkan garis yang dimaksud. Periksa koefisien a, b, dan c.';}
  }else if(w.k==='types'){
    t={ln:w.row};msg='Periksa garis '+ordinal(w.row)+' pada gambar: apakah garis itu tampak penuh atau putus-putus?';
  }else if(w.k==='pick'){
    t={pt:[w.x,w.y]};
    if(w.onLine){var j=0;st.sys.some(function(z,ix){if(z.a*w.x+z.b*w.y===z.c){j=ix;return true;}return false;});msg='Titik ('+n(w.x)+', '+n(w.y)+') berada tepat pada garis '+ordinal(j)+'. Titik uji tidak boleh berada pada garis.';}
    else msg='Titik ('+n(w.x)+', '+n(w.y)+') berada di luar daerah hijau. Pilih titik di dalam DP.';
  }else if(w.k==='subst'){
